[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-ad"
version = "0.1.0"
description = "Anomaly detection platform for fashion retail data: custom ETL, data quality, detection, LLM alerts."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "fastapi",
    "uvicorn",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fashion_ad = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
